<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LogSystem — Recherche</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/search.css">
</head>
<body>
  <nav class="navbar">
    <div class="brand">
      <img src="/image/coleps.png" alt="Coleps" class="brand-logo-img">
      <span>LogSystem</span>
    </div>
    <button class="hamburger" id="hamburger-btn" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
    <ul class="nav-links" id="nav-links">
      <li><a href="/dashboard.html" data-i18n="nav.dashboard">📊 Vue d'ensemble</a></li>
      <li><a href="/search.html" aria-current="page" data-i18n="nav.search">🔍 Rechercher</a></li>
      <li><a href="/import.html" data-i18n="nav.import">📥 Importer</a></li>
      <li><a href="/watchlog.html" data-i18n="nav.watchlog">👁️ Monitoring</a></li>
      <li><a href="/admin.html" id="admin-link" data-i18n="nav.admin">⚙️ Administration</a></li>
    </ul>
    <div class="nav-right">
      <a href="#" id="lang-toggle" class="lang-toggle-link">EN</a>
      <span class="user-info" id="user-info"></span>
      <a href="#" id="logout-btn" class="btn btn-xs btn-secondary" data-i18n="nav.logout">Déconnexion</a>
    </div>
  </nav>

  <main class="page-container" role="main">
    <h1 class="page-title" data-i18n="search.title">Recherche de logs</h1>

    <div class="chips" role="group" aria-label="Filtres rapides">
      <button class="chip" data-chip="today" data-i18n="search.chip.today">Aujourd'hui</button>
      <button class="chip" data-chip="last-hour" data-i18n="search.chip.last_hour">Dernière heure</button>
      <button class="chip" data-chip="24h" data-i18n="search.chip.24h">24 heures</button>
      <button class="chip" data-chip="7j" data-i18n="search.chip.7j">7 jours</button>
      <button class="chip" data-chip="errors" data-i18n="search.chip.errors">Erreurs</button>
      <button class="chip" data-chip="warnings" data-i18n="search.chip.warnings">Warnings</button>
      <button class="chip" data-chip="critical" data-i18n="search.chip.critical">Critiques</button>
      <button class="chip" data-chip="fatal" data-i18n="search.chip.fatal">Fatals</button>
      <button class="chip" data-chip="info" data-i18n="search.chip.info">Info</button>
      <button class="chip" data-chip="debug" data-i18n="search.chip.debug">Debug</button>
    </div>

    <!-- Filtres simplifiés v6 -->
    <div class="card search-filters-card">
      <div class="filter-grid">
        <div class="form-group">
          <label class="filter-label" for="f-search" data-i18n="search.keyword">Mot-clé</label>
          <input type="text" id="f-search" data-i18n-placeholder="search.keyword" placeholder="Mot-clé..." minlength="2" maxlength="500" autocomplete="off">
        </div>
        <div class="form-group">
          <label class="filter-label" for="f-level" data-i18n="search.level">Niveau</label>
          <select id="f-level">
            <option value="" data-i18n="search.all_levels">Tous les niveaux</option>
            <option value="DEBUG">DEBUG</option>
            <option value="INFO">INFO</option>
            <option value="WARNING">WARNING</option>
            <option value="ERROR">ERROR</option>
            <option value="CRITICAL">CRITICAL</option>
            <option value="FATAL">FATAL</option>
          </select>
        </div>
        <div class="form-group">
          <label class="filter-label" for="f-source" data-i18n="search.source">Source</label>
          <select id="f-source">
            <option value="" data-i18n="search.all_sources">Toutes les sources</option>
          </select>
        </div>
        <div class="form-group">
          <label class="filter-label" for="f-user" data-i18n="search.user">Utilisateur</label>
          <select id="f-user">
            <option value="" data-i18n="search.all_users">Tous les utilisateurs</option>
          </select>
        </div>

        <div class="form-group">
          <label class="filter-label" for="f-date-from" data-i18n="search.date_from">Date log (de)</label>
          <input type="date" id="f-date-from">
        </div>
        <div class="form-group">
          <label class="filter-label" for="f-date-to" data-i18n="search.date_to">Date log (à)</label>
          <input type="date" id="f-date-to">
        </div>
      </div>
      <div class="search-hint">
        Recherche combinée ex: <code>ERROR + nginx + 03/06/2026</code>
      </div>
      <div class="search-actions">
        <button class="btn btn-primary" id="search-btn" data-i18n="search.btn">Rechercher</button>
        <button class="btn btn-secondary" id="reset-btn" data-i18n="search.reset">Réinitialiser</button>
        <span id="search-combo-hint" class="search-combo-hint"></span>
      </div>
    </div>

    <div class="flex items-center justify-between mb-16">
      <span class="text-muted" id="results-count"></span>
    </div>
    <div id="facets-bar" class="facets-bar" aria-live="polite"></div>
    <div class="text-hint mb-8">
      <span id="role-indicator"></span>
    </div>

    <div class="card">
      <p class="table-swipe-hint" data-i18n="search.swipe_hint">← Swipe pour voir plus de colonnes</p>
      <div class="table-wrapper">
        <table class="search-table">
          <thead>
            <tr>
              <th data-i18n="search.table.date">Date log</th>
              <th data-i18n="common.level">Niveau</th>
              <th data-i18n="common.source">Source</th>
              <th data-i18n="search.table.user">Utilisateur responsable</th>
              <th data-i18n="common.message">Message</th>
            </tr>
          </thead>
          <tbody id="logs-body" aria-live="polite"></tbody>
        </table>
      </div>
      <div id="logs-pagination"></div>
      <div class="export-actions">
        <button class="btn btn-sm btn-secondary" id="export-csv" data-i18n="search.export_csv">Export CSV</button>
        <button class="btn btn-sm btn-secondary" id="export-pdf" data-i18n="search.export_pdf">Export PDF</button>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="detail-modal">
    <div class="modal modal-wide">
      <div class="modal-header">
        <h3 data-i18n="common.message">Message</h3>
        <button class="modal-close" id="detail-close">&times;</button>
      </div>
      <div id="detail-content"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="detail-close-btn" data-i18n="common.close">Fermer</button>
      </div>
    </div>
  </div>

  <div class="toast-container"></div>

  <script src="/api.js"></script>
  <script src="/i18n.js"></script>
  <script src="/app-common.js"></script>
  <script src="/js/mobile-nav.js" defer></script>
  <script>
    (function() {
      if (!window.api) return;
      var currentPage = 1;
      var totalPages = 1;

      document.getElementById('logout-btn').addEventListener('click', function(e) {
        e.preventDefault();
        window.logout();
      });

      function buildQuery(params) {
        var parts = [];
        for (var k in params) parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
        return parts.join('&');
      }

      window.loadPage = function(page) {
        currentPage = page;
        window.scrollTo(0, 0);
        doSearch();
      };

      function renderFacets(facets) {
        var bar = document.getElementById('facets-bar');
        if (!bar) return;
        if (!facets || !Object.keys(facets).length) { bar.innerHTML = ''; return; }
        bar.innerHTML = Object.keys(facets).map(function(key) {
          return '<span class="facet-badge">' + esc(key) + ' <strong>' + facets[key] + '</strong></span>';
        }).join('');
      }

      function doSearch() {
        var params = getSearchApiParams();
        api.get('/api/search?' + buildQuery(params)).then(function(resp) {
          var rows = resp.logs || [];
          var total = resp.total_count != null ? resp.total_count : rows.length;
          var limit = resp.limit || 50;
          currentPage = Math.floor((resp.offset || 0) / limit) + 1;
          totalPages = Math.max(1, Math.ceil(total / limit));
          document.getElementById('results-count').textContent = 'Résultats: ' + total + ' logs — page ' + currentPage + '/' + totalPages;
          renderFacets(resp.facets);
          var tb = document.getElementById('logs-body');
          if (!rows.length) {
            tb.innerHTML = '<tr><td colspan="5" class="no-data" data-i18n="search.no_results">Aucun résultat</td></tr>';
            document.getElementById('logs-pagination').innerHTML = '';
            return;
          }
          tb.innerHTML = rows.map(function(r) {
            var eventTs = r.event_timestamp || r.timestamp;
            var tsCell = r.timestamp_inferred
              ? '<td><span class="ts-inferred" title="Date inférée">' + fmtDT(eventTs) + ' <small>~</small></span></td>'
              : '<td>' + fmtDT(eventTs) + '</td>';
            var userCell = r.target_user
              ? '<td><span class="user-badge">' + esc(r.target_user) + '</span></td>'
              : '<td><span class="user-empty">—</span></td>';
            return '<tr data-id="'+r.id+'">'
              + tsCell
              + '<td>'+badge(r.log_level)+'</td>'
              + '<td>'+esc(r.source || r.log_source || '—')+'</td>'
              + userCell
              + '<td class="text-truncate">'+esc(r.message)+'</td>'
              + '</tr>';
          }).join('');
          document.getElementById('logs-pagination').innerHTML = paginationHtml(currentPage, totalPages);
        }).catch(function(err) {
          window.toast.error(err.error || 'Erreur lors de la recherche');
        });
      }

      document.getElementById('search-btn').addEventListener('click', function() { currentPage = 1; doSearch(); });
      document.getElementById('f-search').addEventListener('keyup', function(e) { if (e.key === 'Enter') { currentPage = 1; doSearch(); } });
      // Auto-search on page load to show recent logs immediately
      doSearch();

      function getSearchApiParams() {
        var p = getParams();
        var apiParams = {
          limit: 50,
          offset: ((currentPage || 1) - 1) * 50
        };
        if (p.search) apiParams.query = p.search;
        if (p.log_level) apiParams.level = p.log_level;
        if (p.source) apiParams.source = p.source;
        if (p.user) apiParams.target_user = p.user;
        if (p.date_from) apiParams.from_timestamp = p.date_from + 'T00:00:00';
        if (p.date_to) apiParams.to_timestamp = p.date_to + 'T23:59:59';
        return apiParams;
      }

      document.getElementById('reset-btn').addEventListener('click', function() {
        document.getElementById('f-search').value = '';
        document.getElementById('f-level').value = '';
        document.getElementById('f-source').value = '';
        document.getElementById('f-user').value = '';
        document.getElementById('f-date-from').value = '';
        document.getElementById('f-date-to').value = '';
        currentPage = 1;
        doSearch();
      });

      function getParams() {
        var p = { page: currentPage, limit: 50 };
        var search = document.getElementById('f-search').value.trim();
        var level = document.getElementById('f-level').value;
        var source = document.getElementById('f-source').value;
        var user = document.getElementById('f-user').value;
        var dateFrom = document.getElementById('f-date-from').value;
        var dateTo = document.getElementById('f-date-to').value;
        if (search) p.search = search;
        if (level) p.log_level = level;
        if (source) p.source = source;
        if (user) p.user = user;
        if (dateFrom) p.date_from = dateFrom;
        if (dateTo) p.date_to = dateTo;
        return p;
      }

      function applyUrlFilters() {
        var params = new URLSearchParams(window.location.search);
        if (params.has('log_level')) {
          document.getElementById('f-level').value = params.get('log_level');
        }
        if (params.has('source')) {
          document.getElementById('f-source').value = params.get('source');
        }
        if (params.has('user')) {
          document.getElementById('f-user').value = params.get('user');
        }
        if (params.has('search')) {
          document.getElementById('f-search').value = params.get('search');
        }
        if (params.has('date_from')) {
          document.getElementById('f-date-from').value = params.get('date_from').slice(0, 10);
        }
        if (params.has('date_to')) {
          document.getElementById('f-date-to').value = params.get('date_to').slice(0, 10);
        }
      }

      function loadDropdownOptions() {
        // Priorité des sources les plus courantes
        var sourcePriority = ['Splunk', 'Info', 'WAF', 'Apache', 'Nginx', 'Application'];
        
        // Load metadata from the correct API endpoint
        api.get('/api/search/metadata').then(function(data) {
          // Load sources
          var sourceSelect = document.getElementById('f-source');
          if (data && data.sources && Array.isArray(data.sources)) {
            // Trier : sources prioritaires en premier, puis alphabétique
            var sortedSources = data.sources.sort(function(a, b) {
              var indexA = sourcePriority.indexOf(a);
              var indexB = sourcePriority.indexOf(b);
              if (indexA !== -1 && indexB !== -1) return indexA - indexB;
              if (indexA !== -1) return -1;
              if (indexB !== -1) return 1;
              return a.localeCompare(b);
            });
            
            sortedSources.forEach(function(source) {
              var option = document.createElement('option');
              option.value = source;
              option.textContent = source;
              sourceSelect.appendChild(option);
            });
          }

          // Load users
          var userSelect = document.getElementById('f-user');
          if (data && data.target_users && Array.isArray(data.target_users)) {
            // Trier alphabétiquement
            var sortedUsers = data.target_users.sort();
            sortedUsers.forEach(function(user) {
              var option = document.createElement('option');
              option.value = user;
              option.textContent = user;
              userSelect.appendChild(option);
            });
          }
        }).catch(function() {
          // Silently fail if API doesn't support metadata
        });
      }

      document.querySelectorAll('.chip').forEach(function(chip) {
        chip.addEventListener('click', function() {
          document.querySelectorAll('.chip').forEach(function(c) { c.classList.remove('active'); });
          chip.classList.add('active');
          document.getElementById('f-level').value = '';
          document.getElementById('f-search').value = '';
          document.getElementById('f-source').value = '';
          document.getElementById('f-user').value = '';
          document.getElementById('f-date-from').value = '';
          document.getElementById('f-date-to').value = '';

          var type = chip.getAttribute('data-chip');
          function fmtDate(d) {
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
          }
          if (type === 'today') {
            var ds = fmtDate(new Date());
            document.getElementById('f-date-from').value = ds;
            document.getElementById('f-date-to').value = ds;
          } else if (type === 'last-hour' || type === '24h') {
            document.getElementById('f-date-from').value = fmtDate(new Date(Date.now() - (type === '24h' ? 86400000 : 3600000)));
            document.getElementById('f-date-to').value = fmtDate(new Date());
          } else if (type === '7j') {
            document.getElementById('f-date-from').value = fmtDate(new Date(Date.now() - 7*86400000));
            document.getElementById('f-date-to').value = fmtDate(new Date());
          } else if (type === 'errors') {
            document.getElementById('f-level').value = 'ERROR';
          } else if (type === 'warnings') {
            document.getElementById('f-level').value = 'WARNING';
          } else if (type === 'critical') {
            document.getElementById('f-level').value = 'CRITICAL';
          } else if (type === 'fatal') {
            document.getElementById('f-level').value = 'FATAL';
          } else if (type === 'info') {
            document.getElementById('f-level').value = 'INFO';
          } else if (type === 'debug') {
            document.getElementById('f-level').value = 'DEBUG';
          }
          currentPage = 1;
          doSearch();
        });
      });

      document.getElementById('export-csv').addEventListener('click', function() {
        var params = getParams();
        delete params.page;
        delete params.limit;
        window.open('/api/logs/export/csv?' + buildQuery(params), '_blank');
      });

      document.getElementById('export-pdf').addEventListener('click', function() {
        var params = getParams();
        delete params.page;
        delete params.limit;
        window.open('/api/logs/export/pdf?' + buildQuery(params), '_blank');
      });

      document.getElementById('logs-body').addEventListener('click', function(e) {
        var tr = e.target.closest('tr[data-id]');
        if (!tr) return;
        var id = tr.getAttribute('data-id');
        
        // Load log details first
        api.get('/api/logs/' + id).then(function(log) {
          var errorType = log.error_type || null;
          
          // Load recommendation based on error type if available
          var recommendationPromise = errorType ? 
            api.get('/api/recommendations/match/' + encodeURIComponent(errorType) + 
              (log.event_type ? '?event_type=' + encodeURIComponent(log.event_type) : '') +
              (log.log_level ? (log.event_type ? '&' : '?') + 'log_level=' + encodeURIComponent(log.log_level) : '')) :
            Promise.resolve({ recommendation: null });
          
          recommendationPromise.then(function(recData) {
            var recommendation = recData && recData.recommendation ? recData.recommendation : null;
            
            if (window.renderLogDetailHtml) {
              document.getElementById('detail-content').innerHTML = window.renderLogDetailHtml(log, esc, fmtDT, badge);
            } else {
              var html = '<div style="font-size:13px;line-height:1.8">';
              html += '<p><strong data-i18n="modal.id">Identifiant:</strong> ' + log.id + '</p>';
              var eventTs = log.event_timestamp || log.timestamp;
              html += '<p><strong>Date du log:</strong> ' + fmtDT(eventTs);
              if (log.timestamp_inferred) {
                html += ' <span title="La date originale du log n\'a pas pu être extraite. Cette date correspond au moment de l\'import." '
                      + 'style="background:#fef3c7;color:#92400e;padding:2px 7px;border-radius:4px;font-size:11px;margin-left:6px">'
                      + '⚠ date inférée</span>';
              }
              html += '</p>';
              if (log.imported_at) html += '<p><strong>Date d\'import:</strong> ' + fmtDT(log.imported_at) + '</p>';
              html += '<p><strong data-i18n="modal.level">Importance:</strong> ' + badge(log.log_level) + '</p>';
              html += '<p><strong data-i18n="modal.source">Source:</strong> ' + esc(log.source || log.log_source || '—') + '</p>';
              html += '<p><strong data-i18n="modal.service">Service:</strong> ' + esc(log.service || '—') + '</p>';
              html += '<p><strong>Utilisateur responsable du log:</strong> ' + esc(log.target_user || '—') + '</p>';
              if (log.log_origin) html += '<p><strong>Origine:</strong> ' + esc(log.log_origin) + '</p>';
              html += '<hr style="border-color:var(--border);margin:12px 0">';
              html += '<p><strong data-i18n="modal.message">Message:</strong></p><pre style="background:var(--surface2);padding:12px;border-radius:8px;white-space:pre-wrap;word-break:break-all;font-size:12px;max-height:200px;overflow:auto">' + esc(log.message) + '</pre>';
              if (log.stack_trace) {
                html += '<p style="margin-top:8px"><strong>Stack trace:</strong></p><pre style="background:#1a0000;color:#ff6b6b;padding:12px;border-radius:8px;white-space:pre-wrap;word-break:break-all;font-size:11px;max-height:200px;overflow:auto">' + esc(log.stack_trace) + '</pre>';
              }
              
              // Add recommendation if available
              if (recommendation) {
                html += '<div style="background:rgba(16,185,129,0.1);border-left:4px solid #10b981;padding:12px 16px;border-radius:6px;font-size:13px;margin:12px 0"><strong style="color:#10b981">💡 Recommandation :</strong><br><br>' + esc(recommendation) + '</div>';
              }
              
              html += '</div>';
              document.getElementById('detail-content').innerHTML = html;
            }
            document.getElementById('detail-modal').classList.add('active');
          }).catch(function() {
            // If recommendation fails, still show the log details without recommendation
            if (window.renderLogDetailHtml) {
              document.getElementById('detail-content').innerHTML = window.renderLogDetailHtml(log, esc, fmtDT, badge);
            } else {
              var html = '<div style="font-size:13px;line-height:1.8">';
              html += '<p><strong data-i18n="modal.id">Identifiant:</strong> ' + log.id + '</p>';
              var eventTs = log.event_timestamp || log.timestamp;
              html += '<p><strong>Date du log:</strong> ' + fmtDT(eventTs);
              if (log.timestamp_inferred) {
                html += ' <span title="La date originale du log n\'a pas pu être extraite. Cette date correspond au moment de l\'import." '
                      + 'style="background:#fef3c7;color:#92400e;padding:2px 7px;border-radius:4px;font-size:11px;margin-left:6px">'
                      + '⚠ date inférée</span>';
              }
              html += '</p>';
              if (log.imported_at) html += '<p><strong>Date d\'import:</strong> ' + fmtDT(log.imported_at) + '</p>';
              html += '<p><strong data-i18n="modal.level">Importance:</strong> ' + badge(log.log_level) + '</p>';
              html += '<p><strong data-i18n="modal.source">Source:</strong> ' + esc(log.source || log.log_source || '—') + '</p>';
              html += '<p><strong data-i18n="modal.service">Service:</strong> ' + esc(log.service || '—') + '</p>';
              html += '<p><strong>Utilisateur responsable du log:</strong> ' + esc(log.target_user || '—') + '</p>';
              if (log.log_origin) html += '<p><strong>Origine:</strong> ' + esc(log.log_origin) + '</p>';
              html += '<hr style="border-color:var(--border);margin:12px 0">';
              html += '<p><strong data-i18n="modal.message">Message:</strong></p><pre style="background:var(--surface2);padding:12px;border-radius:8px;white-space:pre-wrap;word-break:break-all;font-size:12px;max-height:200px;overflow:auto">' + esc(log.message) + '</pre>';
              if (log.stack_trace) {
                html += '<p style="margin-top:8px"><strong>Stack trace:</strong></p><pre style="background:#1a0000;color:#ff6b6b;padding:12px;border-radius:8px;white-space:pre-wrap;word-break:break-all;font-size:11px;max-height:200px;overflow:auto">' + esc(log.stack_trace) + '</pre>';
              }
              html += '</div>';
              document.getElementById('detail-content').innerHTML = html;
            }
            document.getElementById('detail-modal').classList.add('active');
          });
        });
      });

      document.getElementById('detail-close').addEventListener('click', function() {
        document.getElementById('detail-modal').classList.remove('active');
      });
      document.getElementById('detail-close-btn').addEventListener('click', function() {
        document.getElementById('detail-modal').classList.remove('active');
      });
      document.getElementById('detail-modal').addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('active');
      });

      applyUrlFilters();
      loadDropdownOptions();
      doSearch();
    })();
  </script>
</body>
</html>
