services:
  - type: web
    name: logsystem
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: "true"
      # Base de données MySQL 8 (Aiven ou autre provider)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA_BASE64
        sync: false
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: DB_KEEPALIVE
        value: "true"
      # Sécurité
      - key: SESSION_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: "10"
      # Application
      - key: PORT
        value: "10000"
      - key: IMPORT_BATCH_SIZE
        value: "500"
      - key: ALERT_EVAL_INTERVAL
        value: "60000"
      - key: RETENTION_CRON_HOUR
        value: "3"
      # Limites pour plan gratuit (512 Mo RAM)
      - key: UPLOAD_MAX_SIZE
        value: "209715200"
      - key: DB_CONNECTION_LIMIT
        value: "3"
      # Redis (Render Key Value) — cache du dashboard
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: logsystem-cache
          property: connectionString

  # Render Key Value instance (Redis-compatible) — cache uniquement,
  # pas de données critiques : le plan free suffit (25 Mo, pas de persistance disque).
  - type: keyvalue
    name: logsystem-cache
    region: frankfurt
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []   # connexions internes uniquement, via le réseau privé Render
