# Configuration Apache pour LogSystem
# Placez ce fichier dans /etc/apache2/sites-available/logsystem.conf

<VirtualHost *:80>
    ServerName localhost
    ServerAdmin admin@localhost

    # DocumentRoot pointe vers le dossier public
    DocumentRoot "D:/COLEPS/code/LogSystem/public"

    # Logs Apache
    ErrorLog "D:/COLEPS/code/LogSystem/logs/apache-error.log"
    CustomLog "D:/COLEPS/code/LogSystem/logs/apache-access.log" common

    <Directory "D:/COLEPS/code/LogSystem/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        # Activer la compression
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json

        # Headers de sécurité
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-XSS-Protection "1; mode=block"

        # Cache statique pour les assets
        <FilesMatch "\.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$">
            ExpiresActive On
            ExpiresDefault "access plus 1 year"
        </FilesMatch>
    </Directory>

    # Proxy vers le backend Node.js
    ProxyPreserveHost On
    ProxyRequests Off

    # API routes vers Node.js (port 3000 par défaut)
    ProxyPass /api http://localhost:3000/api
    ProxyPassReverse /api http://localhost:3000/api

    # WebSocket pour SSE (Server-Sent Events)
    ProxyPass /sse http://localhost:3000/sse
    ProxyPassReverse /sse http://localhost:3000/sse
</VirtualHost>

