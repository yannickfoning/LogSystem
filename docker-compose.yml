services:
  app:
    build:
      context: .
      target: runner
      args:
        SESSION_SECRET: ${SESSION_SECRET}
    container_name: logsystem
    restart: unless-stopped
    ports:
      - "${PORT:-10000}:10000"
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=10000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-logsystem}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-logsystem}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
      - RUN_MIGRATIONS_ON_START=true
      - START_BACKGROUND_JOBS=true
      - WATCH_DIR_USER_MAP=/app/logs:1
    volumes:
      - logsystem-uploads:/app/uploads
      - logsystem-logs:/app/logs
      - logsystem-temp:/app/temp
    networks:
      - logsystem
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  mysql:
    image: mysql:8.0
    container_name: logsystem-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-logsystem}
      MYSQL_USER: ${DB_USER:-logsystem}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_HOST: '%'
    volumes:
      - logsystem-mysql:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/migrations:/docker-entrypoint-initdb.d/migrations:ro
    networks:
      - logsystem
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: logsystem-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - logsystem-redis:/data
    networks:
      - logsystem
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  logsystem-uploads:
    driver: local
  logsystem-logs:
    driver: local
  logsystem-temp:
    driver: local
  logsystem-mysql:
    driver: local
  logsystem-redis:
    driver: local

networks:
  logsystem:
    driver: bridge
