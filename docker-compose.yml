services:
  app:
    build:
      context: .
      target: runner
    container_name: logsystem
    restart: unless-stopped
    ports:
      - "10000:10000"
    environment:
      - NODE_ENV=development
      - PORT=10000
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USER=logsystem
      - DB_PASSWORD=LogSystem2024!
      - DB_NAME=logsystem
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=LogSystemRedis2024!
      - SESSION_SECRET=LogSystemSessionSecret2024ChangeThisToSomethingMoreSecure!
      - CSRF_SECRET=LogSystemCSRFSecret2024ChangeThisToSomethingMoreSecure!
      - RUN_MIGRATIONS_ON_START=true
      - START_BACKGROUND_JOBS=true
      - WATCH_DIR_USER_MAP=/app/logs:1
    volumes:
      - logsystem-uploads:/app/uploads
      - logsystem-logs:/app/logs
      - logsystem-temp:/app/temp
    networks:
      - logsystem
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  mariadb:
    image: mariadb:11.4
    container_name: logsystem-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: LogSystem2024!
      MARIADB_DATABASE: logsystem
      MARIADB_USER: logsystem
      MARIADB_PASSWORD: LogSystem2024!
      MARIADB_ROOT_HOST: '%'
    volumes:
      - logsystem-mariadb:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/migrations:/docker-entrypoint-initdb.d/migrations:ro
    networks:
      - logsystem
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-pLogSystem2024!"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: logsystem-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-LogSystemRedis2024!}"]
    volumes:
      - logsystem-redis:/data
    networks:
      - logsystem
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-LogSystemRedis2024!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  logsystem-uploads:
    driver: local
  logsystem-logs:
    driver: local
  logsystem-temp:
    driver: local
  logsystem-mariadb:
    driver: local
  logsystem-redis:
    driver: local

networks:
  logsystem:
    driver: bridge
