services:
  app:
    build:
      context: .
      target: runner
    container_name: logsystem
    restart: unless-stopped
    ports:
      - "${PORT:-10000}:10000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-10000}
      - DB_HOST=${DB_HOST:-mysql}  # Dans Docker, utiliser le nom du service
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-logsystem}
      - DB_PASSWORD=${DB_PASSWORD:-LogSystem2024!}
      - DB_NAME=${DB_NAME:-logsystem}
      - DB_SSL=${DB_SSL:-false}
      - DB_CONNECTION_LIMIT=${DB_CONNECTION_LIMIT:-10}
      - DB_KEEPALIVE=${DB_KEEPALIVE:-true}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-LogSystemRedis2024!}
      - SESSION_SECRET=${SESSION_SECRET:-LogSystemSessionSecret2024ChangeThisToSomethingMoreSecure!}
      - CSRF_SECRET=${CSRF_SECRET:-LogSystemCSRFSecret2024ChangeThisToSomethingMoreSecure!}
      - RUN_MIGRATIONS_ON_START=${RUN_MIGRATIONS_ON_START:-true}
      - START_BACKGROUND_JOBS=${START_BACKGROUND_JOBS:-true}
      - WATCH_DIR_USER_MAP=${WATCH_DIR_USER_MAP:-/app/logs:1}
    volumes:
      - logsystem-uploads:/app/uploads
      - logsystem-logs:/app/logs
      - logsystem-temp:/app/temp
    networks:
      - logsystem
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-10000}/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  mysql:
    image: mysql:8.0
    container_name: logsystem-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_HOST_PORT:-3308}:3306"  # 3308 pour éviter conflit avec XAMPP (3306)
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-LogSystem2024!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-logsystem}
      MYSQL_USER: ${MYSQL_USER:-logsystem}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-LogSystem2024!}
      MYSQL_ROOT_HOST: ${MYSQL_ROOT_HOST:-%}
    volumes:
      - logsystem-mysql:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/migrations:/docker-entrypoint-initdb.d/migrations:ro
    networks:
      - logsystem
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-LogSystem2024!}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci

  redis:
    image: redis:7-alpine
    container_name: logsystem-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-LogSystemRedis2024!}"]
    volumes:
      - logsystem-redis:/data
    networks:
      - logsystem
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-LogSystemRedis2024!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  logsystem-uploads:
    driver: local
  logsystem-logs:
    driver: local
  logsystem-temp:
    driver: local
  logsystem-mysql:
    driver: local
  logsystem-redis:
    driver: local

networks:
  logsystem:
    driver: bridge
